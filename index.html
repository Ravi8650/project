<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ravi Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Decorative Background Elements -->
    <div class="circle circle-top"></div>
    <div class="circle circle-small-left"></div>
    <div class="circle circle-small-right"></div>
    <div class="circle circle-bottom"></div>
    <div class="dots dots-left"></div>
    <div class="dots dots-right"></div>
    <div class="dots dots-bottom"></div>

    <!-- Floating Math Symbols -->
    <div class="floating-symbol plus-one">+</div>
    <div class="floating-symbol plus-two">+</div>
    <div class="floating-symbol minus-one">−</div>
    <div class="floating-symbol divide-one">÷</div>

    <!-- Main Content -->
    <main class="main-container">
      <!-- Header -->
      <section class="header">
        <div class="title-row">
          <div class="calculator-icon">🧮</div>

          <div>
            <h1>Simple Calculator</h1>
            <p>Perform basic calculations with ease</p>
          </div>
        </div>
      </section>

      <!-- Calculator -->
      <section id="calculator">
        <!-- Display -->
        <input
          id="display"
          type="text"
          value="0"
          readonly
          aria-label="Calculator display"
        />

        <!-- Buttons -->
        <div class="button-container">
          <button class="button clear" data-value="C">C</button>
          <button class="button" data-value="1">1</button>
          <button class="button" data-value="2">2</button>

          <button class="button operator" data-value="+">+</button>
          <button class="button" data-value="3">3</button>
          <button class="button" data-value="4">4</button>

          <button class="button operator" data-value="-">−</button>
          <button class="button" data-value="5">5</button>
          <button class="button" data-value="6">6</button>

          <button class="button operator" data-value="*">×</button>
          <button class="button" data-value="7">7</button>
          <button class="button" data-value="8">8</button>

          <button class="button operator" data-value="/">÷</button>
          <button class="button" data-value="9">9</button>
          <button class="button zero" data-value="0">0</button>
          <button class="button equals" data-value="=">=</button>

          <button class="button" data-value=".">.</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
